# Weekly dependency updates. CI tests each pull request.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      # Minor and patch updates arrive as one pull request, so they are easy to review.
      npm-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # Pinned on purpose: it must match the Chromium in the Claude cloud environment.
      - dependency-name: "@playwright/test"
      # eslint-config-next does not load under ESLint 10, and typescript-eslint
      # refuses TypeScript 7. Try again once Next.js supports them.
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: typescript
        update-types: ["version-update:semver-major"]
      # The types follow the Node version in .nvmrc and the Dockerfile, not the newest Node.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
