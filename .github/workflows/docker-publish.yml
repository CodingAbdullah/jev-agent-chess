# Builds the Docker image and publishes it to GitHub's container registry:
#
#   docker run -p 3000:3000 -e TYPESAFE_API_KEY=your-key ghcr.io/codingabdullah/jev-agent-chess
#
# A version tag such as v1.2.3 publishes 1.2.3, 1.2 and latest. A push to main
# publishes `main`, so the newest code can be tried before a release. No secrets
# are used: the built-in GITHUB_TOKEN logs in to the registry, and the API key
# is only ever passed when someone runs the container.
name: Publish Docker image

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    # The arm64 image, for Apple Silicon and Raspberry Pi, builds under emulation and is slow.
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      # Registry names must be lower case: ghcr.io/codingabdullah/jev-agent-chess.
      - name: Name the image
        run: echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=ref,event=branch
          labels: |
            org.opencontainers.image.title=Jev Chess
            org.opencontainers.image.licenses=GPL-3.0-or-later
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
